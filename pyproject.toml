[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsec-reproduce"
version = "0.1.0.dev0"
description = "Experimental elastic sandbox control plane for DSec reproduction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "licenses/miles-APACHE-2.0.txt", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
dsec-sandboxd = "sandboxd:main"
dsec-rollout-worker = "rollout_workerd:main"
dsec-artifact-publisher = "artifact_publisher:main"
dsec-artifact-integrity = "artifact_integrity:main"
dsec-host = "dsec_host:main"
dsec-prepare-image = "dsec_image.prepare:main"

[project.optional-dependencies]
miles = ["openai>=1", "httpx>=0.27"]

[tool.setuptools]
packages = [
    "dsec", "dsec.contracts", "dsec.storage", "dsec.sdk",
    "dsec.runtime", "dsec.runtime.isolation", "dsec.rollout", "dsec.observability",
    "dsec.runtime.backends", "dsec.control", "dsec.host", "dsec.compat",
    "dsec_adapters", "dsec_image",
]
package-dir = {dsec = "src/dsec"}
py-modules = [
    "admission_guard", "artifact_publisher", "artifact_integrity", "container_backend",
    "container_lifecycle_journal", "container_runtime_agent", "container_supervisord",
    "docker_broker", "dsec_host", "durable_manager", "egress_proxy", "elastic_resource_monitor",
    "environment_catalog", "agent_environment", "firecracker_smoke", "framework_profile",
    "libdsec_compat", "microvm", "network_namespace", "privileged_netns_helper", "privileged_install_template", "overlaybd_root_store",
    "overlaybd_ublk_client", "request_journal", "rollout_client", "rollout_store",
    "rollout_workerd", "sandbox_client", "sandbox_resource_meter",
    "shared_snapshot_layers", "snapshot_fork", "sandbox_resource_rpc", "sandbox_sdk", "sandboxd", "scheduled_dsec",
    "service_admin", "shared_service_monitor", "tb2_backend",
    "tb2_verifier_artifact", "work_journal", "work_scheduler",
]

[tool.setuptools.package-data]
dsec_adapters = ["*.json"]
