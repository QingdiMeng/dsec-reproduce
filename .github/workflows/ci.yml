name: Package and regression checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concurrency-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Exhaustive safety checks and required counterexamples
        run: |
          java -version
          python3 tools/check_concurrency_model.py --fetch --cache "$RUNNER_TEMP/dsec-tla" --out "$RUNNER_TEMP/dsec-concurrency-model"
      - name: Real C-agent trace correspondence and historical negative control
        run: python3 tools/check_shutdown_refinement.py --fetch --cache "$RUNNER_TEMP/dsec-tla" --out "$RUNNER_TEMP/dsec-shutdown-refinement"
      - name: Native race regressions, trace correspondence and code mutations
        run: python3 tools/check_native_race_refinement.py --fetch --cache "$RUNNER_TEMP/dsec-tla" --out "$RUNNER_TEMP/dsec-native-races"
      - name: Counterexample evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import tarfile
          from pathlib import Path
          for name in ('dsec-concurrency-model', 'dsec-shutdown-refinement', 'dsec-native-races'):
              root = Path(os.environ['RUNNER_TEMP']) / name
              report = root / 'report.json'
              if report.exists():
                  print(report.read_text())
              for log in sorted(root.glob('*/regression.log')):
                  print(str(log.relative_to(root)))
                  print(log.read_text())
              for log in sorted(root.glob('*/tlc.log')):
                  text = log.read_text()
                  marker = 'Error: The behavior up to this point is:'
                  if marker in text:
                      print(str(log.relative_to(root)))
                      print(text[text.index(marker):])
          with tarfile.open(Path(os.environ['RUNNER_TEMP']) / 'dsec-concurrency-evidence.tar.gz', 'w:gz') as archive:
              for name in ('dsec-concurrency-model', 'dsec-shutdown-refinement', 'dsec-native-races'):
                  root = Path(os.environ['RUNNER_TEMP']) / name
                  if root.exists():
                      archive.add(root, arcname=name,
                                  filter=lambda item: None if 'states' in Path(item.name).parts else item)
          PY
      - name: Preserve model, source and regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: concurrency-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dsec-concurrency-evidence.tar.gz
          retention-days: 14
          if-no-files-found: warn
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install 'setuptools>=77' wheel build
      - name: Build and check packages
        run: |
          cc -static -O2 -Wall -Wextra -Werror -o /tmp/dsec-guest-agent guest_agent.c
          python tools/build_native_agent.py --source guest_native.c --out /tmp/dsec-native-agent
          python -m build --wheel --no-isolation --outdir dist/core .
          python tools/check_wheel.py dist/core/*.whl
          python -m build --wheel --no-isolation --outdir dist/tb21 apps/tb21
          python -m build --wheel --no-isolation --outdir dist/mbpp apps/mbpp
          python tools/check_wheel.py dist/tb21/*.whl --project apps/tb21/pyproject.toml
          python tools/check_wheel.py dist/mbpp/*.whl --project apps/mbpp/pyproject.toml
          python -m pip install dist/core/*.whl
      - name: Core-only installed boundary
        working-directory: /tmp
        run: |
          dsec-sandboxd --help
          dsec-rollout-worker --help
          python -I - <<'PY'
          import importlib.util
          import sys
          from dsec.rollout.worker import RolloutWorker
          from dsec.control import local_api
          from dsec_adapters.dsec_task_registry import task_adapter
          assert importlib.util.find_spec('dsec_tb21_case') is None
          assert importlib.util.find_spec('dsec_mbpp_case') is None
          RolloutWorker(None)
          assert task_adapter('counter').__class__.__name__ == 'CounterDSecEnvironment'
          assert not any(name.startswith('dsec_tb21_case') for name in sys.modules)
          PY
      - name: Install optional applications
        run: python -m pip install dist/tb21/*.whl dist/mbpp/*.whl
      - name: Documentation links
        run: python tools/check_docs.py
      - name: Core and source export regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          from tools.package_release_source import TESTS
          names = ['.'.join(Path(name).with_suffix('').parts) for name in TESTS] + ['tests.packaging.test_release_source']
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(name) for name in names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Optional application regressions
        run: |
          python -m unittest discover -s apps/tb21/tests -v
          python -m unittest discover -s apps/mbpp/tests -v
      - name: Installed entry points outside the source tree
        working-directory: /tmp
        run: |
          dsec-sandboxd --help
          dsec-rollout-worker --help
          dsec-host --help
          dsec-prepare-image --help
          dsec-tb21 --help
          dsec-mbpp --help
          dsec-mbpp-verify --help
          dsec-mbpp-train --help
          dsec-mbpp-compare --help
          python -I - <<'PY'
          import environment_catalog
          import sandbox_client
          from dsec.storage import catalog
          from dsec.sdk import SandboxClient
          from dsec.contracts import ResourceDemand
          assert environment_catalog is catalog
          assert sandbox_client.SandboxClient is SandboxClient
          ResourceDemand(cpu=1, memory_mb=256, disk_mb=256, network_mbps=0)
          PY
